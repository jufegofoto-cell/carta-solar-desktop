name: Build Windows

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Sin esto, action-gh-release falla con 403 al crear la Release: los
# repositorios creados desde febrero de 2023 dan al GITHUB_TOKEN permisos de
# solo lectura por defecto.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ────────────────────────────────────────────────────────────────
      # Verificacion del HTML DEL REPOSITORIO.
      #
      # Este paso NO genera ni reescribe carta_solar.html: solo comprueba que
      # el archivo versionado es la version actual. Incrustar el fuente dentro
      # del workflow (en base64 o en un heredoc) sobreescribe los archivos
      # reales del repositorio y publica versiones viejas sin que nada falle
      # de forma visible. El unico origen valido del HTML es el repositorio.
      # ────────────────────────────────────────────────────────────────
      - name: Verificar el HTML empaquetado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'carta_solar.html')) {
            throw 'Falta carta_solar.html en la raiz del repositorio.'
          }
          $html  = Get-Content 'carta_solar.html' -Raw -Encoding UTF8
          $bytes = (Get-Item 'carta_solar.html').Length
          $sha   = (Get-FileHash 'carta_solar.html' -Algorithm SHA256).Hash

          # Marcadores de las funciones que debe tener la version actual. Si se
          # renombra alguna de ellas, actualizar tambien esta lista o el build
          # fallara sin motivo real.
          $marcadores = [ordered]@{
            'Validacion de coordenadas'   = 'function validarCoords'
            'Hora solar desde el EPW'     = 'function correccionSolar'
            'Corte de acimut cartesiano'  = 'function conecta'
            'Banda ASHRAE 55 al 90%'      = 'const BANDA_PCT = 90'
            'Mascara de sombreado'        = 'function dibujarMascara'
            'Deslizador + campo numerico' = 'function enlazarPar'
            'Repintado coalescido'        = 'function redibujaThrottled'
            'Sello de version CS 2.0.0'   = "const APP_VER='CS 2.0.0'"
          }
          $faltan = @()
          foreach ($m in $marcadores.GetEnumerator()) {
            if ($html -match [regex]::Escape($m.Value)) {
              Write-Host ("  {0,-30} ok" -f $m.Key)
            } else {
              Write-Host ("  {0,-30} FALTA" -f $m.Key)
              $faltan += $m.Key
            }
          }

          # Cero CDN: ninguna referencia externa.
          $externas = ([regex]::Matches($html, '(?:src|href)="https?://')).Count

          Write-Host ''
          Write-Host "Tamano       : $bytes bytes"
          Write-Host "SHA-256      : $sha"
          Write-Host "Ref. externas: $externas"
          Write-Host "@font-face   : $(([regex]::Matches($html, '@font-face')).Count)"

          if ($faltan.Count -gt 0) {
            throw ("El HTML versionado no contiene: " + ($faltan -join ', ') +
                   ". Suba la version actual de carta_solar.html.")
          }
          if ($externas -gt 0) {
            throw "El HTML tiene $externas referencia(s) externa(s); debe ser cero-CDN."
          }
          if ($bytes -lt 220000) {
            throw "carta_solar.html mide $bytes bytes: parece truncado o desactualizado."
          }

          "### Carta Solar"          | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- HTML: $bytes bytes"     | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- SHA-256 HTML: ``$sha``" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # El icono se referencia desde package.json; si no esta, electron-builder
      # no falla: compila con el icono generico de Electron y se descubre el
      # problema al abrir el ejecutable ya publicado.
      - name: Verificar el icono
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'build/icon.ico')) { throw 'Falta build/icon.ico' }
          $b = (Get-Item 'build/icon.ico').Length
          $fs = [IO.File]::ReadAllBytes('build/icon.ico')
          if ($fs[0] -ne 0 -or $fs[1] -ne 0 -or $fs[2] -ne 1) { throw 'build/icon.ico no es un ICO valido' }
          $n = [BitConverter]::ToUInt16($fs, 4)
          $tam = @()
          for ($i = 0; $i -lt $n; $i++) {
            $o = 6 + $i*16
            $w = if ($fs[$o] -eq 0) { 256 } else { [int]$fs[$o] }
            $tam += $w
          }
          Write-Host "icon.ico: $b bytes, $n resoluciones -> $($tam -join ', ')"
          foreach ($req in 16,32,48,256) {
            if ($tam -notcontains $req) { throw "Al icono le falta la resolucion ${req}x${req}." }
          }
          "- Icono: $n resoluciones ($($tam -join ', '))" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # La ventana "Acerca de" (alcance y metodologia) es un HTML aparte que
      # carga src/main.js. Si falta, el menu muestra un error en vez de la
      # ventana; aqui se detecta antes de publicar.
      - name: Verificar la ventana Acerca de
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'src/acerca.html')) {
            throw 'Falta src/acerca.html (ejecutar: python build/generar_acerca.py).'
          }
          $a = Get-Content 'src/acerca.html' -Raw -Encoding UTF8
          foreach ($id in 'alcance','metodologia','limitaciones','referencias','acerca') {
            if ($a -notmatch ('id="' + $id + '"')) { throw "src/acerca.html no tiene la seccion #$id." }
          }
          if ($a -match '@@') { throw 'src/acerca.html tiene marcadores de plantilla sin sustituir.' }
          $ext = ([regex]::Matches($a, '(?:src|href)="https?://')).Count
          if ($ext -gt 0) { throw "src/acerca.html tiene $ext referencia(s) externa(s); debe ser cero-CDN." }
          if (-not (Test-Path 'build/icon.png')) { throw 'Falta build/icon.png' }
          "- Acerca de: $((Get-Item 'src/acerca.html').Length) bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 llego a fin de vida el 30-abr-2026. 24 es Active LTS.
          node-version: '24'
          # setup-node ABORTA si se le pide cache y no encuentra lockfile
          # ("Dependencies lock file is not found"), y lo hace antes de que
          # corra cualquier paso posterior. La expresion deja el valor vacio
          # cuando no hay package-lock.json, que desactiva la cache en vez de
          # romper el build.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      # npm ci exige package-lock.json. Si aun no esta versionado se usa npm
      # install para no romper el build, pero se avisa: sin lockfile cada
      # ejecucion resuelve versiones distintas dentro de los rangos "^".
      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path 'package-lock.json') {
            npm ci --no-audit --no-fund
          } else {
            Write-Warning 'Sin package-lock.json: usando npm install (build no reproducible).'
            "> Sin package-lock.json: build no reproducible." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            npm install --no-audit --no-fund
          }

      - name: Comprobar sintaxis del proceso principal
        run: node --check src/main.js

      # npm run dist lleva --publish never. electron-builder publica por su
      # cuenta cuando hay GH_TOKEN y el build viene de una etiqueta, y eso
      # choca con action-gh-release (assets duplicados o error 422).
      - name: Build portable + installer (x64)
        run: npm run dist

      # Comprobacion cruzada: la version del HTML y la de package.json deben
      # coincidir. Si no, el ejecutable se llamaria 2.1.0 llevando dentro el
      # HTML 2.0.0, que es justo el tipo de desajuste que hace creer que una
      # funcion "no esta" cuando en realidad se empaqueto una version anterior.
      - name: Verificar que HTML y package.json van a la par
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg  = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $html = Get-Content 'carta_solar.html' -Raw -Encoding UTF8
          if ($html -match "const APP_VER='CS ([0-9][^']*)'") {
            $ver = $Matches[1]
            Write-Host "package.json : $pkg"
            Write-Host "carta_solar  : $ver"
            if ($ver -ne $pkg) {
              throw "Descuadre de version: package.json dice $pkg y el HTML dice $ver."
            }
          } else {
            throw 'El HTML no declara APP_VER; no se puede comprobar la version.'
          }

      - name: Listar el resultado
        shell: pwsh
        run: |
          $exes = Get-ChildItem 'dist' -Filter '*.exe' -Recurse
          if (-not $exes) { throw 'electron-builder no produjo ningun .exe en dist/.' }
          foreach ($e in $exes) {
            $mb  = [math]::Round($e.Length / 1MB, 1)
            $sha = (Get-FileHash $e.FullName -Algorithm SHA256).Hash
            Write-Host "$($e.Name)  ($mb MB)  $sha"
            "- ``$($e.Name)`` — $mb MB — SHA-256 ``$sha``" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CartaSolar-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
