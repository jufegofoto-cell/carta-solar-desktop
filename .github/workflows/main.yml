name: Build Windows

# Compila Carta Solar para Windows x64 y publica el .exe en un RELEASE.
# Publicar en Release (en vez de "artifact") evita el límite de
# almacenamiento de artefactos del plan gratuito y no se acumula:
#  - Ejecución manual (Run workflow): actualiza el release "latest".
#  - Empujar una etiqueta vX.Y.Z: crea un release con esa versión.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write          # necesario para crear/actualizar el Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build portable + installer (x64)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Release (no usa la cuota de artefactos)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Última compilación (latest)' }}
          files: dist/*.exe
          fail_on_unmatched_files: true
